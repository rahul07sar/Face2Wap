services:
  postgres:
    image: postgres:16-alpine
    container_name: face2wap-postgres
    environment:
      POSTGRES_DB: face2wap
      POSTGRES_USER: face2wap
      POSTGRES_PASSWORD: face2wap
    ports:
      - "5432:5432"
    volumes:
      - face2wap_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face2wap -d face2wap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: face2wap-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: face2wap-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      args:
        FACE2WAP_RUNTIME_VARIANT: cpu
        FACE2WAP_INSTALL_FACEFUSION: "1"
        FACE2WAP_INSTALL_SOCAITY: "0"
        FACEFUSION_REF: "3.7.1"
    container_name: face2wap-worker
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/app/storage
      - face2wap_facefusion_assets:/opt/facefusion/.assets

  cleanup:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: face2wap-cleanup
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.cleanup_job"]
    profiles:
      - cleanup

volumes:
  face2wap_postgres_data:
  face2wap_facefusion_assets:
